<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO PAGE</title>
    <style>
        h2 {
            display: inline-block;
        }
        textarea {
            width: 500px;
            height: 60px;
        }
    </style>
    <link rel="stylesheet" href="./styles.css">
    <script src="./jquery-3.7.1.min.js"></script>
</head>

<body>
    <h1>This is DEMO PAGE</h1>

    <details>
        <summary><h2>Popup</h2></summary>
        <label>title: <input type="text" id="popupTitle" placeholder="test"></label><br>
        <label>body: <textarea id="popupBody" placeholder="this is a test"></textarea></label><br>
        <label>body is html? <input type="checkbox" id="isHtml"></label><br>
        <label>title text color: <input type="text" id="popupTitleTextColor" placeholder="#000"></label>
        <label>body text color: <input type="text" id="popupBodyTextColor" placeholder="#000"></label><br>
        <label>title background color: <input type="text" id="popupTitleBackgroundColor" placeholder="#c4c4ff"></label>
        <label>body background color: <input type="text" id="popupBodyBackgroundColor" placeholder="#fff"></label><br>
        <label>title size: <input type="text" id="popupTitleSize" placeholder="24px"></label>
        <label>body size: <input type="text" id="popupBodySize" placeholder="16px"></label><br>
        <label>body center-aligning: <input type="checkbox" id="popupBodyCenterAligning"></label><br>
        <label>enter type:
            <select id="popupEnterTypeSelect">
                <option value="0">0: Fade+Scale</option>
                <option value="1">1: Slide from top</option>
                <option value="2">2: Slide from bottom</option>
                <option value="3">3: Slide from left</option>
                <option value="4">4: Slide from right</option>
            </select>
        </label>
        <label>leave type:
            <select id="popupLeaveTypeSelect">
                <option value="">same as enter</option>
                <option value="0">0: Fade+Scale</option>
                <option value="1">1: Slide from top</option>
                <option value="2">2: Slide from bottom</option>
                <option value="3">3: Slide from left</option>
                <option value="4">4: Slide from right</option>
            </select>
        </label><br>
        <label>isConfirm: <input type="checkbox" id="popupIsConfirm"></label><br>
        <label>true text: <input type="text" id="popupTrueText" placeholder="OK"></label>
        <label>true text color: <input type="text" id="popupTrueTextColor" placeholder="#fff"></label>
        <label>true backgroundcolor: <input type="text" id="popupTrueBackgroundColor" placeholder="#0078ff"></label><br>
        <label>false text: <input type="text" id="popupFalseText" placeholder="cancel"></label>
        <label>false text color: <input type="text" id="popupFalseTextColor" placeholder="#000"></label>
        <label>false backgroundcolor: <input type="text" id="popupFalseBackgroundColor" placeholder="#ccc"></label><br>
        <label>onOpen function: <textarea id="popupOnOpen" placeholder="el => {&#xA;console.log('opend', el);&#xA;}"></textarea></label><br>
        <label>onClose function: <textarea id="popupOnClose" placeholder="res => {&#xA;console.log('closed', res);&#xA;}"></textarea></label><br>
        <label>onConfirm function: <textarea id="popupOnConfirm" placeholder="() => {&#xA;console.log('trueBtn pressed');&#xA;}"></textarea></label><br>
        <label>onCancel function: <textarea id="popupOnCancel" placeholder="() => {&#xA;console.log('falseBtn pressed');&#xA;}"></textarea></label><br>
        <button id="popup">create popup</button>
    </details>

    <details>
        <summary><h2>SnackBar</h2></summary>
        <label>text: <input type="text" id="snackText" placeholder="this is a test"></label><br>
        <label>text color: <input type="text" id="snackTextColor" placeholder="#fff"></label>
        <label>backgroundcolor: <input type="text" id="snackBackgroundColor" placeholder="#000"></label><br>
        <label>position
            <label>vertical: <select id="snackVertical">
                <option value="start" selected>start</option>
                <option value="center">center</option>
                <option value="end">end</option>
            </select></label><br>
            <label>horizontal: <select id="snackHorizontal">
                <option value="start">start</option>
                <option value="center">center</option>
                <option value="end" selected>end</option>
            </select></label><br>
        </label>
        <label>direction: <select id="snackDirection">
            <option value="up">up</option>
            <option value="down">down</option>
            <option value="left">left</option>
            <option value="right" selected>right</option>
        </select></label><br>
        <label>disapper time: <input type="number" id="snackDisappearTime" placeholder="10000" min="1">ms</label><br>
        <button id="snackBar">create snackBar</button>
    </details>

    <script type="module">
        import * as FIL from './script.js';

        $('#popup').on('click', async function () {
            const title = $('#popupTitle').val();
            const body = $('#popupBody').val();
            let enterType = $('#popupEnterTypeSelect').val();
            enterType = parseInt(enterType);
            let leaveType = $('#popupLeaveTypeSelect').val();
            if (leaveType === "") leaveType = enterType; // 空なら enterType と同じ
            else leaveType = parseInt(leaveType);

            const isHtml = $('#popupIsHtml').prop('checked');
            const titleTextColor = $('#popupTitleTextColor').val() || undefined;
            const bodyTextColor = $('#popupBodyTextColor').val() || undefined;
            const titleBackgroundColor = $('#popupTitleBackgroundColor').val() || undefined;
            const bodyBackgroundColor = $('#popupBodyBackgroundColor').val() || undefined;
            const titleSize = $('#popupTitleSize').val() || undefined;
            const bodySize = $('#popupBodySize').val() || undefined;
            const bodyCenterAligning = $('#popupBodyCenterAligning').prop('checked');
            const isConfirm = $('#popupIsConfirm').prop('checked');
            const trueText = $('#popupTrueText').val() || undefined;
            const trueTextColor = $('#popupTrueTextColor').val() || undefined;
            const trueBackgroundColor = $('#popupTrueBackgroundColor').val() || undefined;
            const falseText = $('#popupFalseText').val() || undefined;
            const falseTextColor = $('#popupFalseTextColor').val() || undefined;
            const falseBackgroundColor = $('#popupFalseBackgroundColor').val() || undefined;
            const onOpen = eval($('#popupOnOpen').val());
            const onClose = eval($('#popupOnClose').val());
            const onConfirm = eval($('#popupOnConfirm').val());
            const onCancel = eval($('#popupOnCancel').val());

            console.log(
                clean({
                    text: title,
                    textColor: titleTextColor,
                    backgroundColor: titleBackgroundColor,
                    size: titleSize
                })
            )
            console.log(
                clean({
                    text: body,
                    isHtml: isHtml,
                    centerAligning: bodyCenterAligning,
                    textColor: bodyTextColor,
                    backgroundColor: bodyBackgroundColor,
                    size: bodySize
                })
            )
            console.log(
                clean({
                    enter: enterType,
                    leave: leaveType
                })
            )
            console.log(
                cleanOptions({
                    confirm: {
                        isConfirm: isConfirm,
                        true: {
                            text: trueText,
                            textColor: trueTextColor,
                            backgroundColor: trueBackgroundColor
                        },
                        false: {
                            text: falseText,
                            textColor: falseTextColor,
                            backgroundColor: falseBackgroundColor
                        }
                    },
                    callbacks: {
                        onOpen: onOpen,
                        onClose: onClose,
                        onConfirm: onConfirm,
                        onCancel: onCancel
                    }
                })
            )

            let popupConfirm = await FIL.createPopup(
                clean({
                    text: title,
                    backgroundColor: titleBackgroundColor,
                    size: titleSize
                }),
                clean({
                    text: body,
                    isHtml: isHtml,
                    centerAligning: bodyCenterAligning,
                    backgroundColor: bodyBackgroundColor,
                    size: bodySize
                }),
                clean({
                    enter: enterType,
                    leave: leaveType
                }),
                cleanOptions({
                    confirm: {
                        isConfirm: isConfirm,
                        true: {
                            text: trueText,
                            textColor: trueTextColor,
                            backgroundColor: trueBackgroundColor
                        },
                        false: {
                            text: falseText,
                            textColor: falseTextColor,
                            backgroundColor: falseBackgroundColor
                        }
                    },
                    callbacks: {
                        onOpen: onOpen,
                        onClose: onClose,
                        onConfirm: onConfirm,
                        onCancel: onCancel
                    }
                })
            );

            console.log(`popupConfirm: ${popupConfirm}`);
        })

        function clean(obj) {
            return Object.fromEntries(
                Object.entries(obj).filter(([k, v]) => v !== undefined && v !== "")
            );
        }
        function cleanOptions(option) {
            const cleaned = {};

            for (const [key, value] of Object.entries(option)) {

                /* ▼ confirm 特別処理 ▼ */
                if (key === "confirm") {
                    const c = value;

                    if (!c.isConfirm) {
                        cleaned.confirm = { isConfirm: false };
                        continue;
                    }

                    const trueClean = clean(c.true || {});
                    const falseClean = clean(c.false || {});

                    cleaned.confirm = {
                        isConfirm: true,
                        ...(Object.keys(trueClean).length ? { true: trueClean } : {}),
                        ...(Object.keys(falseClean).length ? { false: falseClean } : {})
                    };

                    continue;
                }

                /* ▼ callbacks 特別処理 ▼ */
                if (key === "callbacks") {
                    const cb = value || {};
                    const cleanedCallbacks = clean(cb); // undefined, "" を除去

                    // 中身があれば追加、空なら callbacks ごと捨てる
                    if (Object.keys(cleanedCallbacks).length) {
                        cleaned.callbacks = cleanedCallbacks;
                    }
                    continue;
                }

                /* ▼ confirm / callbacks 以外 ▼ */
                if (value !== undefined && value !== "") {
                    cleaned[key] = value;
                }
            }

            return cleaned;
        }


        $('#snackBar').on('click', function() {
            const text = $('#snackText').val() || undefined;
            const textColor = $('#snackTextColor').val() || undefined;
            const backgroundColor = $('#snackBackgroundColor').val() || undefined;
            const vertical = $('#snackVertical').val();
            const horizontal = $('#snackHorizontal').val();
            const direction = $('#snackDirection').val();
            const disapperTime = $('#snackDisappearTime').val() || undefined;

            console.log(horizontal)
            FIL.createSnackBar(text, textColor, backgroundColor, {vertical: vertical, horizontal: horizontal}, direction, disapperTime);
        })
    </script>
</body>

</html>
